name: Release

# Cutting a release: bump [workspace.package] version in Cargo.toml,
# commit, then tag and push the tag — this workflow builds the binary and
# Linux packages and the Windows portable ZIP, then publishes them together.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (egui/winit on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev wayland-protocols

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${version}"
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Install packaging tools
        run: cargo install cargo-generate-rpm --locked

      - name: Build packages
        run: packaging/build-packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/culltronic*
          if-no-files-found: error

  windows:
    name: Build Windows portable ZIP
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches workspace version
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'culltronic-ui').version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Build portable ZIP
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Packaging audit tests
        run: python -m unittest discover -s packaging -p "test_*.py"
      - name: Smoke-test extracted package
        shell: pwsh
        run: ./packaging/test-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/culltronic-*-windows-x86_64.zip*
          if-no-files-found: error

  publish:
    name: Publish Linux and Windows downloads
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/culltronic* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/culltronic* \
              --title "${GITHUB_REF_NAME}" --generate-notes
          fi
